<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the squadron</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Join the squadron</h1>
    <div id="form-div">
        <form id="sign-up-form" action="">
            <div class="label-input">
                <label for="username">Username: </label>
             <input type="text" name="username" id="username" placeholder="Joe">
            </div>
            <div class="label-input">
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" required placeholder="bema@gmail.com">
            </div>
            <div class="label-input">
                <label for="email">Create Password:</label>
                <input type="password" name="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit">Submit</button>
            <p id="error-msg"></p>
        </form>
        <a href="">Create an account</a>
    </div>
</body>
</html>
